version: 2
updates:
  # NuGet 包（CPM：统一落在 Directory.Packages.props）
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    groups:
      nuget-minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch

  # GitHub Actions 版本
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        applies-to: version-updates
        patterns:
          - '*'
