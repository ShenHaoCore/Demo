name: Release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  publish:
    name: 发布全部 Api 项目
    runs-on: ubuntu-24.04

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 .NET 9 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.x'

      - name: 发布并打包全部 Api 项目
        shell: bash
        run: |
          set -e
          mkdir -p packages
          find . -name 'Demo.*.Api.csproj' -not -path '*/bin/*' -not -path '*/obj/*' | while read -r proj; do
            name=$(basename "$proj" .csproj)
            echo "==> 发布 $name"
            dotnet publish "$proj" -c Release -o "publish/$name" /p:UseAppHost=false --nologo
            (cd publish && zip -r "../packages/$name.zip" "$name")
          done

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: packages/*.zip
          generate_release_notes: true
