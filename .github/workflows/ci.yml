name: CI

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: 构建与测试
    runs-on: ubuntu-24.04

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 .NET 9 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.x'

      - name: 构建解决方案（全部 30 个项目）
        run: dotnet build Demo.sln -c Release --nologo

      - name: 运行测试
        run: dotnet test Demo.sln -c Release --no-build --nologo

  format-check:
    name: 风格检查
    runs-on: ubuntu-24.04

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 .NET 9 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.x'

      - name: dotnet format 校验解决方案
        run: dotnet format Demo.sln --verify-no-changes

  vulnerable-packages:
    name: 依赖漏洞检查
    runs-on: ubuntu-24.04

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 .NET 9 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.x'

      - name: 检查直接与传递依赖的已知漏洞
        shell: bash
        run: |
          set -e
          # 有漏洞时 dotnet list package --vulnerable 退出码非 0（SDK 8+ 行为）；
          # 再按输出兜底扫一遍 High/Critical 关键字，双保险
          out=$(dotnet list Demo.sln package --vulnerable --include-transitive 2>&1) \
            || { echo "$out"; exit 1; }
          echo "$out" | grep -E 'Severity:\s*(High|Critical)' && {
            echo "发现 High/Critical 级别已知漏洞"; exit 1;
          } || true
